[package]
name = "pu-erh-desktop"
version = "0.1.0"
description = "pu-erh desktop shell"
edition.workspace = true
license.workspace = true

[lib]
name = "pu_erh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pu-erh-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
desktop = { path = "../../../crates/desktop" }
tauri = { version = "2", features = [] }
