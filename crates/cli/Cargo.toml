[package]
name = "pu-erh"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "pu-erh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pu-erh-core = { path = "../core", package = "pu-erh-core" }
graph = { path = "../graph" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pu-erh-core = { path = "../core", package = "pu-erh-core" }
tempfile = "3"
