schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Project: pu-erh — block-based graph knowledge base for focused attention
  Metaphor: named after pu-erh tea (grounding, concentration)
  Focus: block-based knowledge base with analytical query capabilities
  Stack: Rust monorepo (crates: cli, core, graph, storage), DataFusion (internal, later), CLI-first
  Architecture: CLI/App → Core (User Session) → Graph (in-memory logical model)
                Core → Storage (on-disk physical model)
                Core → Query (DataFusion over logical graph; later changes)
  UX: custom read-only query language (e.g. parent:<uuid>, children:<uuid>)
      plus separate mutation commands (create, move, delete)
  Block IDs: UUID (v4 for v0)
  Domain: blocks, sessions, knowledge bases, queries, mutations

  Agent policy (anti-default): Read AGENTS.md before UI or Desktop work. Do not invent
  product UX (navigation, save policy, shortcuts, welcome copy, selection model) when
  specs or tasks are silent — stub, disable, or escalate. Infrastructure-only defaults
  (toolkit minimums) are OK. UI adapters call core::Session only. Normative spec:
  openspec/specs/agent-anti-default/spec.md. Wired for Cursor (.cursor/rules/) and
  Claude Code (CLAUDE.md → AGENTS.md).

